    pay_threshold:         { dist: beta, alpha: 6.5, beta: 2.5 }
    historical_completion: { dist: beta, alpha: 2.5, beta: 4.5 }
    avg_daily_minutes:     { dist: lognormal, median: 42, sigma: 0.55, clamp: [5, 200], integer: true }
    payment_mix:      { free: 0.72, occasional: 0.21, regular: 0.06, whale: 0.01 }
    city_tier_mix:    { "1": 0.66, "2": 0.34 }
    gender_mix:       { female: 0.52, male: 0.48 }
    playback_speed_mix: { "1.0": 0.30, "1.25": 0.30, "1.5": 0.32, "2.0": 0.08 }
    genre_priors:
      campus_romance: 0.78
      dark_romance: 0.62
      werewolf_shifter: 0.58
      urban_fantasy: 0.56
      billionaire_romance: 0.50
      revenge_thriller: 0.44
      crime_mystery: 0.38
      corporate_drama: 0.16
    # Campus romance and urban fantasy, discovered and abandoned socially: comfort
    # and thrill in roughly equal measure, with the fantasy progression appetite
    # behind them.
    region_mix:
      slow-burn-comfort-seekers:    0.26
      high-churn-thrill-chasers:    0.24
      status-progression-loyalists: 0.20
      tier1-aspirational-escapists: 0.16
      justice-payoff-bingers:       0.10
      household-catharsis-devotees: 0.04
    listening_privacy: private_earphones
    typical_professions:
      ["Undergraduate student", "Design student", "Law student",
       "MBA aspirant", "Liberal arts student"]
    provisional: true

  # ── Cohorts added after the first live run ────────────────────────────────
  # The original five covered nobody over 52, listened almost entirely on private
  # headphones, and had no concept of a listener returning after a break. Those are
  # not exotic edge cases — they are ordinary listening situations whose absence
  # narrowed the panel. Each of these three fills a specific structural hole.

  - id: evening-household-english
    weight: 0.08
    label: "Older listener, evening at home"
    occasion: >
      Late 40s to 60s, listening at home in the evening, often on a speaker while the
      family is around or on a tablet after dinner. Long uninterrupted blocks, low
      tolerance for anything they would be embarrassed to have overheard, and the
      highest completion rate on the platform — when they commit to a story they
      generally finish it.
    session_pattern: binge
    session_minutes:       { dist: lognormal, median: 58, sigma: 0.40, clamp: [15, 200] }
    gap_hours:             { dist: normal, mean: 24, sd: 5, clamp: [10, 72] }
    tenure_months:         { dist: exponential, mean: 14, clamp: [0.5, 60], integer: true }
    age:                   { dist: normal, mean: 53, sd: 6, clamp: [45, 68], integer: true }
    churn_sensitivity:     { dist: beta, alpha: 2.5, beta: 5 }
    pay_threshold:         { dist: beta, alpha: 3, beta: 5 }
    historical_completion: { dist: beta, alpha: 5, beta: 3 }
    avg_daily_minutes:     { dist: lognormal, median: 65, sigma: 0.40, clamp: [10, 240], integer: true }
    interruption_load:     { dist: beta, alpha: 3, beta: 5 }
    payment_mix:      { free: 0.28, occasional: 0.32, regular: 0.30, whale: 0.10 }
    city_tier_mix:    { "1": 0.62, "2": 0.38 }
    gender_mix:       { female: 0.56, male: 0.44 }
    playback_speed_mix: { "1.0": 0.84, "1.25": 0.13, "1.5": 0.03 }
    discovery_mix:    { in_app_recommendation: 0.34, friend: 0.30, ad: 0.24, browsing: 0.12 }
    genre_priors:
      crime_mystery: 0.68
      corporate_drama: 0.54
      billionaire_romance: 0.46
      revenge_thriller: 0.44
      campus_romance: 0.24
      dark_romance: 0.22
      urban_fantasy: 0.20
      werewolf_shifter: 0.14
    region_mix:
      household-catharsis-devotees: 0.34
      slow-burn-comfort-seekers:    0.28
      justice-payoff-bingers:       0.18
      tier1-aspirational-escapists: 0.10
      status-progression-loyalists: 0.07
      high-churn-thrill-chasers:    0.03
