    tenure_months:         { dist: exponential, mean: 7, clamp: [0.5, 36], integer: true }
    age:                   { dist: normal, mean: 28, sd: 5, clamp: [19, 45], integer: true }
    churn_sensitivity:     { dist: beta, alpha: 6, beta: 3 }
    pay_threshold:         { dist: beta, alpha: 3.5, beta: 4.5 }
    historical_completion: { dist: beta, alpha: 2.5, beta: 5 }
    avg_daily_minutes:     { dist: lognormal, median: 48, sigma: 0.35, clamp: [15, 160], integer: true }
    payment_mix:      { free: 0.38, occasional: 0.34, regular: 0.21, whale: 0.07 }
    city_tier_mix:    { "1": 0.84, "2": 0.16 }
    gender_mix:       { male: 0.58, female: 0.42 }
    playback_speed_mix: { "1.0": 0.34, "1.25": 0.32, "1.5": 0.29, "2.0": 0.05 }
    genre_priors:
      revenge_thriller: 0.72
      crime_mystery: 0.62
      urban_fantasy: 0.54
      werewolf_shifter: 0.46
      dark_romance: 0.40
      corporate_drama: 0.36
      billionaire_romance: 0.34
      campus_romance: 0.30
    # Revenge thriller at 0.72 with an explicit intolerance for slow dialogue —
    # the lowest-patience cohort in either market.
    region_mix:
      high-churn-thrill-chasers:    0.36
      justice-payoff-bingers:       0.30
      status-progression-loyalists: 0.16
      tier1-aspirational-escapists: 0.12
      slow-burn-comfort-seekers:    0.04
      household-catharsis-devotees: 0.02
    listening_privacy: private_headphones
    typical_professions:
      ["Sales manager", "Fitness trainer", "Backend engineer", "Investment analyst",
       "Brand manager", "Physiotherapist"]
    provisional: true

  - id: student-english
    weight: 0.11
    label: "English-medium student"
    occasion: >
      College student on an English-medium campus, listening between lectures and on
      shared rides. Discovers series socially and drops them socially. Almost entirely
      on the free tier, and unlocking early costs a real trade-off against canteen money.
    session_pattern: drip
    session_minutes:       { dist: lognormal, median: 26, sigma: 0.55, clamp: [6, 130] }
    gap_hours:             { dist: normal, mean: 18, sd: 10, clamp: [3, 96] }
    tenure_months:         { dist: exponential, mean: 5, clamp: [0.5, 30], integer: true }
    age:                   { dist: normal, mean: 20, sd: 2, clamp: [17, 26], integer: true }
