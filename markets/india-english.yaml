  - id: lapsed-returner-english
    weight: 0.07
    label: "Returning after a break"
    occasion: >
      Was active months ago, drifted off mid-series, and has come back to try something
      new. Long platform tenure but no current habit, so the relationship is genuinely
      fragile: they remember abandoning the last one and are half-expecting to abandon
