    pay_threshold:         { dist: beta, alpha: 5, beta: 3 }
    historical_completion: { dist: beta, alpha: 2, beta: 6 }
    avg_daily_minutes:     { dist: lognormal, median: 30, sigma: 0.60, clamp: [5, 160], integer: true }
    interruption_load:     { dist: beta, alpha: 5, beta: 4 }
