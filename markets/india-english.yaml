# ─────────────────────────────────────────────────────────────────────────────
# Market: India / English
#
# Deliberately NOT a translation of india-hindi. The genre taxonomy, cohort mix,
# competitive set and price sensitivity are all different, because the audience is
# different — metro-skewed, higher ARPU, and competing against Audible, Spotify
# podcasts and Netflix rather than against Instagram reels and film songs.
#
# This file exists so `--market` is a real parameter and not decoration: running the
# same script against both markets must produce different cohorts and a different
# fit map. See the "provider/market parity" checks in the README.
#
# All values PROVISIONAL — hand-authored, not fitted from logs.
# ─────────────────────────────────────────────────────────────────────────────

market: india-english
language: English
script_system: latin
reasoning_language: English

currency: INR
coin_pack_label: "99-coin pack"
money_anchor: "a 99-coin pack costs about what one coffee at a chain cafe costs"

alternatives:
  - "a Spotify podcast"
  - "an Audible audiobook"
  - "a Netflix episode on the second screen"
  - "Instagram reels"
  - "a YouTube video essay"
  - "music while working"
  - "switching the audio off entirely to focus"

genres:
  - billionaire_romance
  - dark_romance
  - werewolf_shifter
  - revenge_thriller
  - campus_romance
  - urban_fantasy
  - crime_mystery
  - corporate_drama

cities_by_tier:
  "1": [Bengaluru, Mumbai, Delhi, Hyderabad, Pune, Gurugram, Chennai, Noida, Kolkata]
  "2": [Kochi, Chandigarh, Indore, Jaipur, Coimbatore, Bhubaneswar, Vizag, Mysuru]

genre_noise: 0.15

# ─────────────────────────────────────────────────────────────────────────────
# Discovery channel — how they arrived at THIS series. [T-C]
#
# Sits on the occasion axis because it is a fact about acquisition, not taste. It
# earns its place by changing the continue decision at exactly the point the panel
# was weakest: an ad-acquired listener has expectations set by a creative that
# promised something specific, and churns hard when episode 3 is not that. A
# friend-recommended listener extends more credit and blames themselves first.
# Cohorts may override; this is the market default.
discovery_mix:
  ad: 0.42
  in_app_recommendation: 0.30
  browsing: 0.16
  friend: 0.12

# ─────────────────────────────────────────────────────────────────────────────
# Need model
#
# Same six need regions as every other market, imported from the shared file —
# a region is platform identity, not a market's local invention. What differs
# here is the JOIN: which regions each occasion cohort draws from. The resulting
# marginal region shares are visibly different from india-hindi, which is the
# point of `--market` being a real parameter on this axis too:
#
#            india-english        india-hindi
#   comfort        24%                14%
#   tier1          22%                10%
#   thrill         20%                13%
#   justice        17%                27%
#   status         11%                20%
#   household       7%                16%
#
# This market sits closest to the profile the source ontology evidences for US
# romance — comfort-led, romance-dense, thrill-tolerant — which is why the two
# regions weakest in Hindi are the two strongest here.
# ─────────────────────────────────────────────────────────────────────────────

ontology: _ontology

# Only `register_mix` is overridable, and only where a market's language genuinely
# moves the distribution. This audience competes against Audible and podcasts and
# abandons anything that reads as translated, so the three most pulp-weighted
# regions shift toward the middle register here. Everything else about a region —
# drivers, banks, pay psychology — is platform identity and cannot be overridden.
region_overrides:
  justice-payoff-bingers:
    register_mix: { pulp: 0.56, mid: 0.36, literary: 0.08 }
  status-progression-loyalists:
    register_mix: { pulp: 0.54, mid: 0.38, literary: 0.08 }
  high-churn-thrill-chasers:
    register_mix: { pulp: 0.70, mid: 0.26, literary: 0.04 }

cohorts:

  - id: metro-commuter-english
    weight: 0.21
    label: "Metro commuter, cab or metro rail"
    occasion: >
      45-70 minutes each way in a cab or on the metro, headphones on, phone in hand.
      Reads and listens in English by default and will abandon a series that feels
      translated rather than written in English.
    session_pattern: binge
    session_minutes:       { dist: lognormal, median: 50, sigma: 0.40, clamp: [10, 180] }
    gap_hours:             { dist: normal, mean: 12, sd: 4, clamp: [2, 36] }
    tenure_months:         { dist: exponential, mean: 8, clamp: [0.5, 42], integer: true }
    age:                   { dist: normal, mean: 29, sd: 5, clamp: [20, 48], integer: true }
    churn_sensitivity:     { dist: beta, alpha: 5, beta: 3 }
    pay_threshold:         { dist: beta, alpha: 3, beta: 5 }
    historical_completion: { dist: beta, alpha: 3, beta: 4 }
    avg_daily_minutes:     { dist: lognormal, median: 95, sigma: 0.35, clamp: [15, 320], integer: true }
    payment_mix:      { free: 0.30, occasional: 0.34, regular: 0.27, whale: 0.09 }
    city_tier_mix:    { "1": 0.86, "2": 0.14 }
    gender_mix:       { female: 0.54, male: 0.46 }
    playback_speed_mix: { "1.0": 0.40, "1.25": 0.34, "1.5": 0.23, "2.0": 0.03 }
    genre_priors:
      billionaire_romance: 0.70
      crime_mystery: 0.64
      dark_romance: 0.58
      revenge_thriller: 0.54
      corporate_drama: 0.48
      urban_fantasy: 0.42
      campus_romance: 0.38
      werewolf_shifter: 0.34
    # Corporate drama plus billionaire romance in a metro professional cohort is
    # the tier-1 aspirational signature.
    region_mix:
      tier1-aspirational-escapists: 0.32
      slow-burn-comfort-seekers:    0.22
      justice-payoff-bingers:       0.18
      high-churn-thrill-chasers:    0.14
      status-progression-loyalists: 0.08
      household-catharsis-devotees: 0.06
    listening_privacy: private_headphones
    typical_professions:
      ["Software engineer", "Consultant", "Marketing manager", "Product designer",
       "Data analyst", "Chartered accountant", "Talent acquisition specialist"]
    provisional: true

  - id: wfh-multitasker
    weight: 0.18
    label: "Work-from-home, audio as background"
    occasion: >
      Listens while doing laundry, cooking or low-focus work at home. Constantly
      half-attending, so anything requiring close tracking of names or timelines is
      lost. Pauses and resumes across the day rather than in one block.
    session_pattern: drip
    session_minutes:       { dist: lognormal, median: 30, sigma: 0.50, clamp: [8, 160] }
    gap_hours:             { dist: normal, mean: 22, sd: 9, clamp: [4, 96] }
    tenure_months:         { dist: exponential, mean: 9, clamp: [0.5, 48], integer: true }
    age:                   { dist: normal, mean: 31, sd: 6, clamp: [21, 52], integer: true }
    churn_sensitivity:     { dist: beta, alpha: 5, beta: 3.5 }
    pay_threshold:         { dist: beta, alpha: 3.5, beta: 4.5 }
    historical_completion: { dist: beta, alpha: 2.5, beta: 4.5 }
    avg_daily_minutes:     { dist: lognormal, median: 70, sigma: 0.45, clamp: [10, 280], integer: true }
    payment_mix:      { free: 0.36, occasional: 0.34, regular: 0.23, whale: 0.07 }
    city_tier_mix:    { "1": 0.74, "2": 0.26 }
    gender_mix:       { female: 0.62, male: 0.38 }
    playback_speed_mix: { "1.0": 0.48, "1.25": 0.30, "1.5": 0.19, "2.0": 0.03 }
    genre_priors:
      billionaire_romance: 0.66
      campus_romance: 0.54
      corporate_drama: 0.52
      crime_mystery: 0.50
      dark_romance: 0.48
      urban_fantasy: 0.40
      revenge_thriller: 0.38
      werewolf_shifter: 0.36
    # Half-attending across a whole day is the comfort region's natural habitat:
    # steady progression survives interruption, twist cadence does not.
    region_mix:
      slow-burn-comfort-seekers:    0.34
      tier1-aspirational-escapists: 0.26
      household-catharsis-devotees: 0.16
      justice-payoff-bingers:       0.12
      high-churn-thrill-chasers:    0.08
      status-progression-loyalists: 0.04
    listening_privacy: mixed
    typical_professions:
      ["Content writer", "Customer success manager", "Remote QA engineer",
       "Freelance illustrator", "Online tutor", "Operations coordinator"]
    provisional: true

  - id: night-binger-english
    weight: 0.18
    label: "Night binger, private and undistracted"
    occasion: >
      Headphones on in bed between 11pm and 2am. The most attentive listener in the
      market and the most willing to spend to avoid a wait, but also the quickest to
      notice a filler episode because nothing else is competing for attention.
    session_pattern: binge
    session_minutes:       { dist: lognormal, median: 62, sigma: 0.45, clamp: [12, 240] }
    gap_hours:             { dist: normal, mean: 24, sd: 4, clamp: [10, 60] }
    tenure_months:         { dist: exponential, mean: 11, clamp: [0.5, 54], integer: true }
    age:                   { dist: normal, mean: 26, sd: 6, clamp: [18, 45], integer: true }
    churn_sensitivity:     { dist: beta, alpha: 5.5, beta: 3 }
    pay_threshold:         { dist: beta, alpha: 2.2, beta: 5.5 }
    historical_completion: { dist: beta, alpha: 3.5, beta: 3.5 }
    avg_daily_minutes:     { dist: lognormal, median: 80, sigma: 0.45, clamp: [15, 300], integer: true }
    payment_mix:      { free: 0.22, occasional: 0.32, regular: 0.32, whale: 0.14 }
    city_tier_mix:    { "1": 0.78, "2": 0.22 }
    gender_mix:       { female: 0.66, male: 0.34 }
    playback_speed_mix: { "1.0": 0.62, "1.25": 0.24, "1.5": 0.12, "2.0": 0.02 }
    genre_priors:
      dark_romance: 0.82
      billionaire_romance: 0.74
      werewolf_shifter: 0.62
      urban_fantasy: 0.56
      campus_romance: 0.48
      revenge_thriller: 0.44
      crime_mystery: 0.42
      corporate_drama: 0.28
    # Dark romance at 0.82 splits this cohort: the region that wants a safe
    # relationship arc and the region that wants the next shock are both here in
    # force, which is why it is the most informative cohort in this market.
    region_mix:
      slow-burn-comfort-seekers:    0.30
      high-churn-thrill-chasers:    0.24
      tier1-aspirational-escapists: 0.16
      justice-payoff-bingers:       0.14
      status-progression-loyalists: 0.10
      household-catharsis-devotees: 0.06
    listening_privacy: private_headphones
    typical_professions:
      ["Graphic designer", "Junior doctor", "Postgraduate student", "Copywriter",
       "Software developer", "Architect", "Research associate"]
    provisional: true

