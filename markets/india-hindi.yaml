  - id: tier1-multitasker
    weight: 0.07
    label: "Metro professional, audio as background"
    occasion: >
      Metro-city white-collar listener using audio as a background layer over the gym,
      a cab, or work-from-home chores. Code-mixes Hindi and English constantly and has
