    age:                   { dist: normal, mean: 30, sd: 6, clamp: [21, 50], integer: true }
    churn_sensitivity:     { dist: beta, alpha: 5.5, beta: 3 }
    pay_threshold:         { dist: beta, alpha: 3, beta: 5 }
    historical_completion: { dist: beta, alpha: 2.5, beta: 5 }
    avg_daily_minutes:     { dist: lognormal, median: 55, sigma: 0.45, clamp: [10, 220], integer: true }
    payment_mix:      { free: 0.34, occasional: 0.34, regular: 0.24, whale: 0.08 }
    city_tier_mix:    { "1": 0.82, "2": 0.16, "3": 0.02 }
    gender_mix:       { male: 0.54, female: 0.46 }
    playback_speed_mix: { "1.0": 0.36, "1.25": 0.34, "1.5": 0.25, "2.0": 0.05 }
    genre_priors:
      crime_thriller: 0.70
      badla: 0.52
      forbidden_romance: 0.50
      bold_romance: 0.48
      horror_supernatural: 0.44
      system_progression: 0.40
      saas_bahu: 0.18
      mythology_devotional: 0.18
    # Metro, Hinglish, career-adjacent — the tier-1 aspirational region's home
    # occasion, and the one cohort where it is the plurality.
    region_mix:
      tier1-aspirational-escapists: 0.46
      high-churn-thrill-chasers:    0.18
      slow-burn-comfort-seekers:    0.14
      justice-payoff-bingers:       0.12
      status-progression-loyalists: 0.06
      household-catharsis-devotees: 0.04
    listening_privacy: private_headphones
    typical_professions:
      ["Software engineer", "Product manager", "Marketing associate", "HR generalist",
