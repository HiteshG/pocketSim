[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pocketsim"
version = "0.1.0"
description = "Synthetic listener panel for Pocket FM scripts — simulate retention, paywall placement and drop-off before production."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "openai>=1.40",
    "numpy>=1.26",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.scripts]
pocketsim = "pocketsim.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pocketsim"]

[tool.ruff]
line-length = 100
target-version = "py311"
